<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TrendLens{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><span class="logo"></span>TrendLens</div>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'on' if request.endpoint == 'home' }}">Home</a>
      <a href="{{ url_for('upload') }}" class="{{ 'on' if request.endpoint == 'upload' }}">Upload data</a>
      <a href="{{ url_for('history') }}" class="{{ 'on' if request.endpoint in ('history', 'dashboard') }}">History</a>
      <a href="{{ url_for('regression') }}" class="{{ 'on' if request.endpoint == 'regression' }}">regression</a>
      <a href="{{ url_for('about') }}" class="{{ 'on' if request.endpoint == 'about' }}">About</a>
    </nav>
    <button id="theme" class="ghost">Toggle light / dark</button>
  </aside>
  <main>
    <button class="burger" id="burger" aria-label="Toggle menu">&#9776; Menu</button>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
